<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grupo Alme · Manual de diseño de servicios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Montserrat:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0a0a0b;--card:#141415;--tx:#eee8dc;--mu:#a8a296;--ac:#f1e7cf;--go:#c9a96a;--bd:#2b2a28;--hi:#1c1b19;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:19px/1.7 "Cormorant Garamond",Georgia,"Times New Roman",serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(8,8,9,.9),rgba(8,8,9,.95)),var(--bgi) center/cover}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(10,10,11,.92);border-bottom:1px solid var(--bd)}
header b{flex:1;font:500 13px "Montserrat",system-ui,sans-serif;letter-spacing:.34em;color:var(--go);cursor:pointer}
button,.btn{font:500 12px "Montserrat",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border:1px solid var(--go);background:transparent;color:var(--tx);padding:13px 20px;text-decoration:none;display:inline-block}
.btn.p{background:var(--go);color:#111}
#menu{font-size:20px;padding:4px 12px;letter-spacing:0;border-color:var(--bd)}
nav{position:fixed;inset:0 auto 0 0;width:min(80vw,310px);background:#101011;border-right:1px solid var(--bd);transform:translateX(-105%);transition:transform .2s;z-index:9;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px;font-family:"Montserrat",system-ui,sans-serif}
nav.o{transform:none}nav h3{margin:0 0 14px;color:var(--go);font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:500}
nav a{display:block;padding:13px 10px;color:var(--tx);text-decoration:none;font-size:13px;letter-spacing:.08em}nav a.on{color:var(--go);border-left:2px solid var(--go)}
#sh{position:fixed;inset:0;background:#000a;z-index:8;display:none}#sh.o{display:block}
main{max-width:800px;margin:0 auto;padding:22px 20px 70px}main.wide{max-width:none;padding:0}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;color:var(--ac);font-weight:600}
h1{font-size:36px;line-height:1.15;margin:8px 0;letter-spacing:.03em}h2{font-size:27px;margin:4px 0 16px}
a{color:var(--go)}
.sub{color:var(--mu);font:400 13px "Montserrat",system-ui,sans-serif;letter-spacing:.06em}
.grp{margin:26px 0 10px;font:500 11px "Montserrat",system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--go)}
.it{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin:0 0 8px;padding:15px 18px;font:500 20px "Cormorant Garamond",Georgia,serif;letter-spacing:.02em;text-transform:none;border-color:var(--bd);background:rgba(20,20,21,.75)}
.it span{color:var(--go)}.it:hover{border-color:var(--go)}
p{text-align:justify;margin:0 0 15px}
table{width:100%;border-collapse:collapse;font:400 14px/1.5 "Montserrat",system-ui,sans-serif;margin:6px 0 18px}
.tw{overflow-x:auto}th{background:var(--go);color:#111;padding:10px;text-align:left;font-weight:600;letter-spacing:.06em}td{padding:10px;border:1px solid var(--bd);vertical-align:top;background:rgba(20,20,21,.7)}
.ax{background:rgba(20,20,21,.8);border-left:2px solid var(--go);padding:13px 16px;margin:0 0 12px;text-align:justify}
.nv{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:18px}
.card{text-align:left;padding:18px;font:600 22px "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;text-transform:none;color:var(--ac);border-color:var(--bd);background:rgba(20,20,21,.8)}
.card:hover{border-color:var(--go)}.card small{display:block;font:400 12px "Montserrat",system-ui,sans-serif;letter-spacing:.04em;color:var(--mu);margin-top:5px}
dl{margin:18px 0;font-family:"Montserrat",system-ui,sans-serif}dt{font-weight:500;color:var(--go);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:18px}dd{margin:4px 0 0;font-size:14.5px;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.warn{border:1px solid var(--bd);padding:11px 15px;font:13px/1.55 "Montserrat",system-ui,sans-serif;color:var(--mu);margin-top:14px}
.hero{min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background-size:cover;background-position:center}
.logo{width:min(260px,62vw);height:auto;margin-bottom:6px;mix-blend-mode:screen}
.brand{font-size:clamp(40px,12.5vw,110px);letter-spacing:.2em;text-indent:.2em;font-weight:500;color:#f5edd9;margin:6px 0 4px;line-height:1.05}
.tag{text-align:center;color:var(--go);font:400 12px "Montserrat",system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;margin:6px 0 30px}
.row2{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.col{max-width:920px;margin:0 auto;padding:30px 18px 70px}
.collage{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:150px;gap:8px}
.collage img{width:100%;height:100%;object-fit:cover;display:block;border:1px solid var(--bd)}
.collage .t{grid-row:span 2}.collage .w{grid-column:span 2}
@media(max-width:560px){.collage{grid-template-columns:repeat(2,1fr);grid-auto-rows:130px}.collage .w{grid-column:span 2}}
.wm{text-align:center;padding:14px 0 6px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.wm img{width:96px;height:auto;mix-blend-mode:screen}
.wm div{font:500 clamp(26px,8vw,44px) "Cormorant Garamond",Georgia,serif;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:var(--ac);margin-top:4px}
.wm .sub{margin-top:2px}
</style></head><body>

["Introducción","1. Introducción al documento","<p>Este manual analiza el servicio de Grupo Alme desde la Ciencia de los Servicios, la disciplina que estudia cómo se diseñan, se entregan y se mejoran los servicios para crear valor, tanto para la empresa como para el cliente que los vive. Lo escribimos pensando en cualquier persona, aunque no sepa nada del tema, y por eso explicamos cada concepto con palabras sencillas y ejemplos de cómo funciona el grupo en el día a día.</p><p>En las siguientes páginas se encuentra, primero, una descripción de la empresa y de la experiencia que ofrece. Después hay una introducción a los servicios, con sus características y la forma en que el negocio pasó de vender un producto a ofrecer una experiencia. Al final se explica la lógica dominante del servicio y sus premisas aplicadas a Grupo Alme, que es la idea que conecta todo el manual.</p>"],
["Quiénes son","2. La empresa: Grupo Alme","<p>Grupo Alme es un grupo familiar mexicano dedicado a la gastronomía y el entretenimiento, fundado por el empresario Juan Altamirano. Tiene más de una década de trayectoria en el sector restaurantero, desde aproximadamente 2011 (Grupo Alme, 2026). Es una empresa 100% familiar en la que participan los familiares del fundador en áreas como arquitectura, cocina y operación (Grupo Alme, 2026). En la apertura de La Madalena en Cancún, por ejemplo, se destacó que el diseño arquitectónico estuvo a cargo del patriarca de la familia y que los postres son creación de la matriarca (Riviera Maya News, s.f.).</p><p>Su misión es que cada concepto integre las raíces mexicanas, un servicio de excelencia y algunos de los spots más especiales de la gastronomía y el entretenimiento del país (Grupo Alme, 2026). Sus restaurantes llevan el sello, el sabor y la frescura de ingredientes nacionales, combinados con productos de importación (como los de Japón, Alaska o Chile) para darle un giro a la cocina tradicional. El grupo se sostiene en tres pilares que son valores de familia: <b>atender, compartir y servir</b>, compartidos con todos los colaboradores para que el cliente se sienta en un ambiente familiar.</p><p>Según su página oficial, hoy reúne 16 conceptos: Azia, Ánima, Beluga, Isabela, La Madalena, Six, Strana, Casitas Mariaka, Cristina, Code, Más Salsa, Meza, Sham Burgers!, La Pesca, Dumbo Hi-Fi y Colette. Puedes consultarlos en la sección “Restaurantes y antros”.</p><div class=tw><table><tr><th>Ficha</th><th></th></tr><tr><td>Fundador</td><td>Juan Altamirano</td></tr><tr><td>Origen del nombre</td><td>La Madalena rinde homenaje a la abuela de la familia, María Magdalena, y se basa en recetas familiares tradicionales.</td></tr><tr><td>Presencia</td><td>Guadalajara, Cancún, Puerto Vallarta, Monterrey, Tepic y Ciudad de México.</td></tr></table></div>"],
["El servicio y la experiencia","2. La empresa: servicio y experiencia","<p>Cuando alguien va a La Madalena, Beluga o Azia, no solo está comprando comida o una bebida, sino un servicio de hospitalidad completo. Ahí entran el recibimiento del host, la atención del mesero, el DJ en vivo, la iluminación, los platillos que el chef prepara al momento y el ambiente del lugar. La comida es importante, pero es solo una parte de algo más grande: la experiencia de pasar la noche en el restaurante.</p><p>A diferencia de las cadenas que repiten el mismo formato en todas sus sucursales, Grupo Alme crea conceptos con identidad propia. Cada uno tiene su cocina, su diseño y su ambiente, pero todos comparten los valores de la familia: atender, compartir y servir (Grupo Alme, 2026). Lo que los hace diferentes es la combinación de raíces mexicanas, toques internacionales en la cocina, espacios diseñados por la propia familia y un trato pensado para que el cliente se sienta como en casa.</p>"],
["Concepto de servicio","3. Introducción a los servicios","<p>Un servicio es una actividad que busca satisfacer las necesidades de un cliente mediante la atención, los conocimientos y la experiencia. A diferencia de un producto físico, no se puede guardar ni llevar a casa de la misma manera, porque gran parte de su valor está en cómo se siente y en la atención que recibe la persona.</p><p>En Grupo Alme, el servicio no consiste únicamente en preparar y vender alimentos: también incluye recibir a los clientes, atenderlos durante su visita, cuidar el ambiente y ofrecerles un espacio para convivir y disfrutar. La empresa señala en su página oficial que busca ofrecer un servicio de excelencia y crear experiencias especiales en cada concepto.</p><p>Por ejemplo, cuando fui a Cristina, noté que la atención y la hospitalidad forman parte de la experiencia desde que entras. Aunque no se pueden tocar, sí se notan en el trato del personal y en cómo te hacen sentir. Desde la perspectiva de Pine y Gilmore (1998, p. 97), las empresas pueden diferenciarse al crear experiencias memorables: un negocio no solo debe preocuparse por lo que vende, sino por lo que vive el cliente mientras recibe el servicio.</p>"],
["Características","3. Características de los servicios","<p>Los servicios tienen cuatro características principales: intangibilidad, inseparabilidad, heterogeneidad y carácter perecedero (Zeithaml et al., 1985). Ayudan a entender por qué la experiencia del cliente depende de varios elementos además de la comida.</p><div class=tw><table><tr><th>Característica</th><th>Definición</th><th>En Grupo Alme</th></tr><tr><td>Intangibilidad</td><td>No se puede tocar ni probar completamente antes de recibirlo.</td><td>En Cristina, la hospitalidad se percibe por el trato del personal y el ambiente, aunque no se pueda tocar.</td></tr><tr><td>Inseparabilidad</td><td>Se produce y se consume al mismo tiempo; el cliente participa.</td><td>En La Madalena, la atención, la preparación de los alimentos y la interacción en la mesa suceden durante la visita.</td></tr><tr><td>Heterogeneidad</td><td>Cambia según el personal, el momento y el cliente.</td><td>Ánima se relaciona con el entorno natural y la playa; Cristina ofrece un ambiente acogedor de desayunos y panadería. Cada cliente lo vive distinto.</td></tr><tr><td>Carácter perecedero</td><td>No se puede almacenar; la capacidad no usada se pierde.</td><td>Una mesa vacía en La Madalena en hora de alta demanda es una oportunidad de servicio que no se recupera.</td></tr></table></div><p>Por eso administrar un restaurante de Grupo Alme es diferente a administrar una fábrica: no basta con buenos ingredientes, también hay que organizar al personal, atender a los clientes y cuidar el ambiente.</p>"],
["Evolución","3. Evolución: del producto al servicio","<p><b>El producto tradicional.</b> Antes se podía pensar que el principal producto de un restaurante era la comida: el cliente acudía para satisfacer una necesidad básica, alimentarse, y el valor estaba en los ingredientes, el sabor y la cantidad. En Grupo Alme la propuesta va más allá: su página oficial destaca la hospitalidad, la calidad y el cuidado de los espacios.</p><p><b>La transformación hacia el servicio.</b> Pine y Gilmore (1998) explican que las empresas pueden diferenciarse al ofrecer experiencias que las personas recuerden. En Grupo Alme se observa en tres aspectos:</p><div class=ax><b>El plato como parte de la experiencia.</b> La Madalena destaca por su propuesta gastronómica centrada en cortes y por una experiencia donde la comida forma parte de una ocasión especial.</div><div class=ax><b>El ambiente como parte del servicio.</b> Ánima, en Puerto Vallarta, combina el entorno natural de la costa con la gastronomía y el diseño de sus espacios; Cristina tiene un ambiente acogedor con café y panadería.</div><div class=ax><b>Una atención más personalizada.</b> Un mesero que conoce el menú y responde a las necesidades del cliente mejora su experiencia. En mi experiencia en Cristina noté la importancia del trato desde la entrada.</div><p>En resumen, Alme pasó de vender comida a diseñar noches: mientras el producto resuelve el deseo de comer, el servicio resuelve el deseo de vivir algo especial esa noche.</p>"],
["Fundamentos","4. Lógica dominante del servicio","<p>La lógica dominante del servicio, propuesta por Vargo y Lusch (2004), explica que los negocios no deben enfocarse solo en vender productos, sino en cómo usan sus conocimientos y habilidades para ayudar a sus clientes. No se trata únicamente de lo que compras, sino de lo que la empresa hace para ofrecerte valor.</p><p>Cuando una persona visita un restaurante de Grupo Alme, no solo paga por la comida y las bebidas: también recibe atención del personal, disfruta el diseño del lugar y convive con otras personas. Los alimentos, las bebidas y las instalaciones son medios para ofrecer esa experiencia, y el cliente participa con sus decisiones y preferencias. Por eso el valor no depende solo de lo que ofrece la empresa, sino de cómo lo vive cada persona.</p>"],
["Axiomas","4. Las premisas del servicio","<p>Los cinco axiomas (Vargo y Lusch, 2016) aplicados a Alme:</p><div class=ax><b>Axioma 1 (FP1): el servicio es la base del intercambio.</b> Lo que Alme da a sus clientes no es solo comida o bebida, sino un servicio de excelencia; la comida es el medio.</div><div class=ax><b>Axioma 2 (FP6): el valor se co-crea entre varios actores, incluido siempre el beneficiario.</b> La experiencia en Beluga, Azia o Strana depende también del cliente: con quién va, qué pide y cómo se relaciona con el lugar.</div><div class=ax><b>Axioma 3 (FP9): todos los actores integran recursos.</b> El cliente junta lo que Alme le ofrece con su tiempo, su compañía, la ocasión que celebra y su estado de ánimo.</div><div class=ax><b>Axioma 4 (FP10): el valor lo define el beneficiario, de forma única y subjetiva.</b> Una cena en La Madalena puede ser una celebración inolvidable para una persona y solo una salida más para otra.</div><div class=ax><b>Axioma 5 (FP11): la co-creación se coordina con instituciones y reglas del juego.</b> Los protocolos de atención, la cultura de “atender, compartir y servir” y las reglas de cada concepto (reservaciones, código de vestimenta) hacen que la experiencia sea consistente.</div>"],
["Premisas complementarias","4. Premisas complementarias","<div class=tw><table><tr><th>Premisa</th><th>En Grupo Alme</th></tr><tr><td>FP2. El intercambio indirecto oculta la base del intercambio</td><td>Detrás de una cena intervienen cocineros, proveedores, capitanes, bartenders y músicos; esa red queda oculta y el cliente percibe un solo servicio.</td></tr><tr><td>FP3. Los bienes son un mecanismo de distribución del servicio</td><td>Platillos, bebidas y espacios son el medio por el que llegan la atención, el ambiente y la convivencia.</td></tr><tr><td>FP4. Los recursos operantes son la fuente de ventaja estratégica</td><td>Las recetas familiares, la técnica de los chefs, el diseño de los espacios y el entrenamiento del personal.</td></tr><tr><td>FP5. Todas las economías son economías de servicio</td><td>Aunque trabajan con ingredientes, los restaurantes compiten por la calidad de la atención y la experiencia.</td></tr><tr><td>FP7. Los actores solo proponen valor</td><td>Alme propone menú, ambiente y atención; el valor se concreta cuando el cliente lo aprovecha.</td></tr><tr><td>FP8. La visión de servicio es relacional y centrada en el beneficiario</td><td>Atender, compartir y servir se traducen en un trato cercano que busca una relación más allá de una visita.</td></tr></table></div><p>En conjunto, para Alme el éxito no depende solo de tener buena comida, sino de diseñar bien todo lo que rodea la visita y dejar espacio para que cada cliente construya su propia experiencia.</p>"],
["Referencias","Referencias bibliográficas","<p style='text-align:left'>Grupo Alme. (2026, 23 de septiembre). <i>Grupo Alme | Restaurantes y bares en Guadalajara, Monterrey y Vallarta</i>. https://grupoalme.mx/</p><p style='text-align:left'>Pine, B. J., II, &amp; Gilmore, J. H. (1998). Welcome to the experience economy. <i>Harvard Business Review, 76</i>(4), 97–105.</p><p style='text-align:left'>Riviera Maya News. (s.f.). <i>New in Cancún: La Madalena by Grupo Alme unveiled</i>. https://www.rivieramayanews.mx/?p=4289</p><p style='text-align:left'>Vargo, S. L., &amp; Lusch, R. F. (2004). Evolving to a new dominant logic for marketing. <i>Journal of Marketing, 68</i>(1), 1–17.</p><p style='text-align:left'>Vargo, S. L., &amp; Lusch, R. F. (2008). Service-dominant logic: Continuing the evolution. <i>Journal of the Academy of Marketing Science, 36</i>(1), 1–10.</p><p style='text-align:left'>Vargo, S. L., &amp; Lusch, R. F. (2016). Institutions and axioms: An extension and update of service-dominant logic. <i>Journal of the Academy of Marketing Science, 44</i>(1), 5–23.</p><p style='text-align:left'>Zeithaml, V. A., Parasuraman, A., &amp; Berry, L. L. (1985). Problems and strategies in services marketing. <i>Journal of Marketing, 49</i>(2), 33–46.</p>"]];

const $=s=>document.querySelector(s),app=$("#app"),nav=$("#nav"),sh=$("#sh");
const E=s=>encodeURIComponent(s);
document.documentElement.style.setProperty("--bgi","url("+IMG.lounge+")");
function tog(o){nav.classList.toggle("o",o);sh.classList.toggle("o",o)}
$("#menu").onclick=()=>tog(!nav.classList.contains("o"));sh.onclick=()=>tog(false);$("#brand").onclick=()=>go("inicio");
function go(h){location.hash=h}
function wire(){app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>go(b.dataset.g))}
function landing(){
  const c=[["pink","t"],["club","w"],["bamboo","t"],["sushi",""],["lounge","w"]];
  app.innerHTML="<section class=hero style=\"background-image:linear-gradient(rgba(5,5,6,.6),rgba(5,5,6,.92)),url("+IMG.club+")\"><img class=logo src='"+IMG.logo+"' alt='Logo de Grupo Alme'><h1 class=brand>GRUPO ALME</h1><p class=tag>Gastronomía y entretenimiento en México</p><div class=row2><button class='btn p' data-g=manual>Entrar al manual</button><button class=btn data-g=locales>Restaurantes y antros</button></div></section><section class=col><div class=grp style='text-align:center'>Nuestros espacios</div><div class=collage>"+c.map(x=>"<img class='"+x[1]+"' src='"+IMG[x[0]]+"' alt='Espacio de Grupo Alme' loading=lazy>").join("")+"</div></section>";
  wire();
}
function home(){
  let h="<h1>Manual de diseño de servicios</h1><p class=sub>Caso: Grupo Alme · Ciencia de los Servicios, O2026<br>Diego Emiliano Nava Pulido, Alejandro Castro, Aaron Sandoval Díaz y Emiliano Navarro Vargas</p><h2 style='margin-top:28px'>Índice</h2>",g="";
  P.forEach((p,i)=>{if(G[i]!==g){g=G[i];h+="<div class=grp>"+g+"</div>"}h+="<button class='it' data-g='p"+i+"'>"+p[0]+"<span>›</span></button>"});
  app.innerHTML=h;wire();
}
function page(i){
  const p=P[i];
  app.innerHTML="<button data-g=manual>← Índice</button><div class=sub style='margin-top:18px'>"+G[i]+"</div><h2>"+p[1]+"</h2>"+p[2]+"<div class=nv>"+(i>0?"<button data-g='p"+(i-1)+"'>← "+P[i-1][0]+"</button>":"<span></span>")+(i<P.length-1?"<button class='btn p' data-g='p"+(i+1)+"'>"+P[i+1][0]+" →</button>":"<span></span>")+"</div>";
  wire();
}
function locales(){
  let h="<h1>Restaurantes y antros</h1><p class=sub>Los 16 conceptos que aparecen en la página oficial de Grupo Alme.</p><div class=warn>Reservas especiales para artistas y personalidades: se solicitan directamente con el grupo en contacto@grupoalme.mx, indicando el concepto y la ciudad.</div><div class=grid>";
  V.forEach(v=>h+="<button class='card' data-g='r-"+v[0]+"'>"+v[1]+"<small>"+(v[2].length?v[2].join(" · "):"Ver detalles")+"</small></button>");
  app.innerHTML=h+"</div>";wire();
}
function local(s){
  const v=V.find(x=>x[0]===s);if(!v)return locales();
  const mp=c=>"https://www.google.com/maps/search/?api=1&query="+E(v[1]+" "+c),cs=v[2].length?v[2]:["Grupo Alme"];
  const b="<div class=row>"+cs.map(c=>"<a class='btn p' target=_blank rel=noopener href='"+mp(c)+"'>📍 Ubicación"+(cs.length>1?" · "+c:"")+"</a>").join("")+"<a class=btn target=_blank rel=noopener href='https://grupoalme.mx/"+v[3]+"'>Página oficial</a>"+(v[4]?"<a class=btn target=_blank rel=noopener href='https://www.instagram.com/"+v[4]+"'>Instagram</a>":"")+"</div>";
  app.innerHTML="<button data-g=locales>← Todos</button><div class=wm style='margin-top:16px'><img src='"+IMG.logo+"' alt='Grupo Alme'><div>"+v[1]+"</div><p class=sub style='text-align:center'>"+(v[2].length?v[2].join(" · "):"Grupo Alme")+"</p></div>"+b+
  "<dl><dt>Historia</dt><dd>"+(v[5]||"Aún sin completar. Consulta la página oficial del concepto.")+"</dd>"+
  "<dt>Reservaciones y contacto</dt><dd>Correo del grupo: contacto@grupoalme.mx"+(v[6]?"<br>"+v[6].join("<br>"):"<br>También puedes reservar desde la página oficial o el Instagram del concepto.")+"</dd>"+
  "<dt>Reservas especiales (artistas y personalidades)</dt><dd>Se solicitan escribiendo a contacto@grupoalme.mx e indicando el concepto y la ciudad.</dd>"+
  "<dt>Reseñas, estrellas y demanda</dt><dd>Consulta las reseñas, las estrellas y los “Horarios populares” (qué días y horas hay más gente) en la ficha de Google Maps, con el botón de Ubicación.</dd>"+
  "<dt>Reconocimientos</dt><dd>Sin datos verificados todavía.</dd></dl><div class=warn>Esta página no puede consultar reseñas ni horarios en vivo; por eso se ven en Google Maps.</div>";
  wire();
}
function route(){
  const h=location.hash.slice(1)||"inicio";tog(false);
  $("#n0").className=h==="inicio"?"on":"";$("#n1").className=h==="manual"||/^p\d+$/.test(h)?"on":"";$("#n2").className=h==="locales"||h.startsWith("r-")?"on":"";
  app.className=h==="inicio"?"wide":"";
  if(h==="locales")locales();else if(h.startsWith("r-"))local(h.slice(2));else if(/^p\d+$/.test(h)&&P[+h.slice(1)])page(+h.slice(1));else if(h==="manual")home();else landing();
  scrollTo(0,0);
}
addEventListener("hashchange",route);route();
</script></body></html>
